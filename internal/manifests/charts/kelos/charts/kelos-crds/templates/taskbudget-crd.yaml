apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
    {{- if .Values.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
  name: taskbudgets.kelos.dev
spec:
  group: kelos.dev
  names:
    kind: TaskBudget
    listKind: TaskBudgetList
    plural: taskbudgets
    shortNames:
    - tb
    singular: taskbudget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.period.type
      name: Period
      type: string
    - jsonPath: .spec.maxCostUSD
      name: Max Cost
      priority: 1
      type: string
    - jsonPath: .status.used.costUSD
      name: Used Cost
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          TaskBudget defines observed-spend admission limits for Tasks.
          When a Task's labels match a TaskBudget's taskSelector and the budget
          is exceeded, the Task stays in Waiting phase with a BudgetBlocked
          condition until the period resets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Spec is required. A spec-less TaskBudget would decode to an empty selector
              (matching all Tasks) and an empty period, which fails closed and blocks
              Task admission for the whole namespace.
            properties:
              maxCostUSD:
                anyOf:
                - type: integer
                - type: string
                description: MaxCostUSD is the maximum observed completed-task cost
                  admitted in the period.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: maxCostUSD must be non-negative
                  rule: 'type(self) == int ? self >= 0 : !quantity(self).isLessThan(quantity(''0''))'
              maxInputTokens:
                description: MaxInputTokens is the maximum observed input tokens admitted
                  in the period.
                format: int64
                minimum: 0
                type: integer
              maxOutputTokens:
                description: MaxOutputTokens is the maximum observed output tokens
                  admitted in the period.
                format: int64
                minimum: 0
                type: integer
              period:
                description: Period defines the accounting window for this budget.
                properties:
                  timezone:
                    default: UTC
                    description: |-
                      Timezone is the IANA timezone used to compute period boundaries.
                      Defaults to UTC. The XValidation rule rejects names that the controller
                      cannot load (getHours errors on an unknown IANA zone), so an invalid
                      timezone cannot be stored and fail closed at admission.
                    maxLength: 64
                    pattern: ^[A-Za-z0-9/_+-]+$
                    type: string
                    x-kubernetes-validations:
                    - message: timezone must be a valid IANA time zone
                      rule: timestamp('2000-01-01T00:00:00Z').getHours(self) >= 0
                  type:
                    description: Type is the period boundary used for budget accounting.
                    enum:
                    - Daily
                    type: string
                required:
                - type
                type: object
              taskSelector:
                description: |-
                  TaskSelector selects Tasks and TaskRecords in the same namespace.
                  An empty selector ({}) selects all Tasks in the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - period
            - taskSelector
            type: object
            x-kubernetes-validations:
            - message: at least one of maxCostUSD, maxInputTokens, or maxOutputTokens
                must be set
              rule: has(self.maxCostUSD) || has(self.maxInputTokens) || has(self.maxOutputTokens)
          status:
            description: TaskBudgetStatus tracks the current accounting period and
              usage.
            properties:
              conditions:
                description: Conditions provides detailed status information.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentPeriodEnd:
                description: CurrentPeriodEnd is the exclusive end of the current
                  accounting period.
                format: date-time
                type: string
              currentPeriodStart:
                description: CurrentPeriodStart is the inclusive start of the current
                  accounting period.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              used:
                description: Used contains usage summed from matching TaskRecords
                  in the current period.
                properties:
                  attempts:
                    description: |-
                      Attempts holds the normalized usage of each agent Pod the Task ran,
                      in creation order. CostUSD, InputTokens and OutputTokens above are
                      the legacy totals of the latest Pod only, in each agent's native
                      meaning; Attempts is the breakdown that counts every attempt once.
                      Set only for agent types whose output Kelos normalizes (claude-code,
                      codex, opencode).
                    items:
                      description: UsageAttempt is the usage of one agent Pod of a
                        Task.
                      properties:
                        breakdown:
                          description: |-
                            Breakdown is the attempt's normalized usage. When the Pod printed
                            none or its log could not be read, the controller records a
                            breakdown with coverage Missing and a note saying why.
                          properties:
                            costSource:
                              description: CostSource names what computed ReportedCostUSD
                                (the agent type).
                              type: string
                            coverage:
                              description: Coverage states how much of the attempt's
                                usage this holds.
                              enum:
                              - Complete
                              - Partial
                              - Missing
                              type: string
                            final:
                              description: Final is true when the agent printed its
                                terminal usage summary.
                              type: boolean
                            includesSubagents:
                              description: |-
                                IncludesSubagents is true when the model totals already include the
                                usage of the subagents the run started.
                              type: boolean
                            models:
                              description: Models holds one entry per model the run
                                used.
                              items:
                                description: |-
                                  ModelUsage is the usage of one model within a run. Token counters are
                                  disjoint except ReasoningOutputTokens, which OutputTokens includes, and
                                  the CacheWrite5m/1h split, which CacheWriteInputTokens includes. An
                                  absent counter is unknown, not zero.
                                properties:
                                  cacheReadInputTokens:
                                    description: CacheReadInputTokens are input tokens
                                      read from a prompt cache.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  cacheWrite1hInputTokens:
                                    description: |-
                                      CacheWrite1hInputTokens is the part of CacheWriteInputTokens written
                                      with a one-hour lifetime, when reported.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  cacheWrite5mInputTokens:
                                    description: |-
                                      CacheWrite5mInputTokens is the part of CacheWriteInputTokens written
                                      with a five-minute lifetime, when reported.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  cacheWriteInputTokens:
                                    description: CacheWriteInputTokens are input tokens
                                      written to a prompt cache.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  canonicalModel:
                                    description: CanonicalModel is the agent's canonical
                                      id for Model, when reported.
                                    type: string
                                  costBasis:
                                    description: |-
                                      CostBasis is the agent's label for how it priced ReportedCostUSD,
                                      when it gives one.
                                    type: string
                                  model:
                                    description: |-
                                      Model is the model id as reported, or as configured (ModelSource).
                                      Empty when neither is known.
                                    type: string
                                  modelSource:
                                    description: ModelSource states where Model comes
                                      from.
                                    enum:
                                    - Reported
                                    - Configured
                                    type: string
                                  otherCounters:
                                    additionalProperties:
                                      format: int64
                                      type: integer
                                    description: |-
                                      OtherCounters keeps numeric usage counters the agent reported that
                                      this contract does not name yet, under the agent's own key.
                                    maxProperties: 32
                                    type: object
                                  outputTokens:
                                    description: OutputTokens are all output tokens,
                                      reasoning included.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  provider:
                                    description: Provider is the model provider, when
                                      reported or configured.
                                    type: string
                                  reasoningOutputTokens:
                                    description: ReasoningOutputTokens is the reasoning
                                      part of OutputTokens.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  reportedCostUSD:
                                    description: |-
                                      ReportedCostUSD is this model's cost in USD as the agent reported
                                      it, a plain non-negative decimal string.
                                    maxLength: 40
                                    pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                                    type: string
                                  uncachedInputTokens:
                                    description: |-
                                      UncachedInputTokens are input tokens neither read from nor written
                                      to a prompt cache.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                  webSearchRequests:
                                    description: WebSearchRequests is the number of
                                      server-side web searches.
                                    format: int64
                                    minimum: 0
                                    type: integer
                                type: object
                              maxItems: 32
                              type: array
                              x-kubernetes-list-type: atomic
                            notes:
                              description: |-
                                Notes are short machine-readable reasons for the coverage, such as
                                no-final-result or subagent-usage-not-reported.
                              items:
                                maxLength: 64
                                type: string
                              maxItems: 16
                              type: array
                              x-kubernetes-list-type: atomic
                            reportedCostUSD:
                              description: |-
                                ReportedCostUSD is the run's cost in USD as the agent itself reported
                                it (CostSource), never a Kelos estimate: a plain non-negative decimal
                                string, exact as printed.
                              maxLength: 40
                              pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                              type: string
                            runner:
                              description: Runner is the agent type whose output was
                                parsed.
                              type: string
                            schemaVersion:
                              description: SchemaVersion is the version of this contract.
                              format: int32
                              minimum: 1
                              type: integer
                            sessionID:
                              description: SessionID is the agent's own session or
                                thread id.
                              type: string
                            subagents:
                              description: |-
                                Subagents are the child sessions the run started, when the output
                                names them.
                              items:
                                description: SubagentUsageRef identifies a child session
                                  of a run.
                                properties:
                                  id:
                                    description: ID is the child session id as the
                                      agent printed it.
                                    minLength: 1
                                    type: string
                                  model:
                                    description: Model is the child's model, when
                                      printed.
                                    type: string
                                  usageIncluded:
                                    description: UsageIncluded is true when the child's
                                      usage is inside Models.
                                    type: boolean
                                required:
                                - id
                                type: object
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - coverage
                          - schemaVersion
                          type: object
                        podName:
                          description: PodName is the agent Pod whose output was read.
                          minLength: 1
                          type: string
                        podUID:
                          description: PodUID identifies the attempt across Pods that
                            reuse a name.
                          type: string
                      required:
                      - breakdown
                      - podName
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  costUSD:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CostUSD is the reported agent cost in USD.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: costUSD must be non-negative
                      rule: 'type(self) == int ? self >= 0 : !quantity(self).isLessThan(quantity(''0''))'
                  inputTokens:
                    description: InputTokens is the number of input tokens consumed.
                    format: int64
                    minimum: 0
                    type: integer
                  outputTokens:
                    description: OutputTokens is the number of output tokens produced.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
